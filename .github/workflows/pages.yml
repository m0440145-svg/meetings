name: Publish website branch

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "website-publish"
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare website
        run: |
          mkdir -p public
          cp index.html styles.css theme.css theme.js a11y.js script.js home.js nav-fix.js supabase-config.js supabase-app.js advanced-supabase.js production-features.js platform-settings.js nav-groups.js member-space.js insights.js governance.js development.js archive-reports.js reminders.js scheduler.js landing.js banners-admin.js decisions.js xlsx-lite.js dm-core.js dm-views.js dm-detail.js dm-admin.js ics.js meeting-manage.js members-manage.js bodies-manage.js surveys.js ai-assistant.js minute-draft.js ai-advisor.js live-meeting.js security-view.js files-center.js circulars.js vdr.js minute-history.js board-packs.js conflicts.js reg-assist.js access-gate.js meeting-create-guard.js view-access.js member-access.js access-requests.js risk-audit.js general-assembly.js exec-dashboard.js delivery-health.js demo-labels.js 404.html .nojekyll public/
          cp -R assets public/assets
          # رقم إصدار للملفات يمنع بقاء نسخة قديمة في كاش المتصفح بعد كل نشر
          sed -i "s/__BUILD__/${GITHUB_SHA::8}/g" public/index.html public/home.js

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
