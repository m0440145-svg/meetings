name: Publish website branch

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "website-publish"
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare website
        run: |
          mkdir -p public
          cp index.html styles.css script.js home.js nav-fix.js supabase-config.js supabase-app.js advanced-supabase.js production-features.js 404.html .nojekyll public/
          cp -R assets public/assets

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
