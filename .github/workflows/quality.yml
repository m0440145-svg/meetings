# فحوصات الجودة: تعمل عند كل طلب دمج وعند الدمج في main. لا تنشر شيئًا ولا تمسّ الموقع، ونتيجتها معلوماتية لا تمنع النشر.
name: Quality checks
on:
  pull_request:
  push:
    branches: ["main"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
